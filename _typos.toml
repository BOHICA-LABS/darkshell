[files]
extend-exclude = [
    "Cargo.lock",
    "*.svg",
    "e2e/",
    "proto/",
    "python/openshell/_proto/",
    # Upstream OCSF schemas use Apple's UDID term (not a typo)
    "crates/openshell-ocsf/schemas/",
    # Upstream architecture docs use crate names like ratatui
    "architecture/",
    # Upstream third-party notices contain Dutch legal text
    "THIRD-PARTY-NOTICES",
]

[default.extend-words]
# Technical terms that typos flags incorrectly
ratatui = "ratatui"
UDID = "UDID"
