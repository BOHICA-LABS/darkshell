[package]
name = "openshell-cli"
description = "DarkShell CLI — enhanced OpenShell for the DarkClaw factory ecosystem"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "darkshell"
path = "src/main.rs"

[dependencies]
openshell-bootstrap = { path = "../openshell-bootstrap" }
openshell-core = { path = "../openshell-core" }
openshell-policy = { path = "../openshell-policy" }
openshell-providers = { path = "../openshell-providers" }
openshell-tui = { path = "../openshell-tui" }
darkshell-blueprint = { path = "../darkshell-blueprint" }
darkshell-mcp = { path = "../darkshell-mcp" }
darkshell-observe = { path = "../darkshell-observe" }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
prost-types = { workspace = true }

# Async runtime
tokio = { workspace = true }

# gRPC client
tonic = { workspace = true, features = ["tls", "tls-native-roots"] }

# CLI
clap = { workspace = true }
clap_complete = { workspace = true }
crossterm = { workspace = true }
dialoguer = "0.11"
indicatif = { workspace = true }
owo-colors = { workspace = true }

# HTTP client (health fallback)
bytes = { workspace = true }
http-body-util = { workspace = true }
hyper = { workspace = true }
hyper-util = { workspace = true }
hyper-rustls = { version = "0.27", default-features = false, features = ["native-tokio", "http1", "tls12", "logging", "ring", "webpki-tokio"] }
rustls = { workspace = true }
rustls-pemfile = { workspace = true }
tokio-rustls = { workspace = true }
reqwest = { workspace = true }

# Error handling
miette = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }

# File archiving (tar-over-SSH sync)
tar = "0.4"

# DS-006: SHA256 hashing for dry-run file comparison
sha2 = "0.10"

# WebSocket (Cloudflare tunnel proxy)
tokio-tungstenite = { workspace = true }

# Streams
futures = { workspace = true }
nix = { workspace = true }

# URL parsing
url = { workspace = true }

# Logging
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[lints]
workspace = true

[features]
dev-settings = ["openshell-core/dev-settings"]

[dev-dependencies]
futures = { workspace = true }
rcgen = { version = "0.14", features = ["crypto", "pem"] }
reqwest = { workspace = true }
serde_json = { workspace = true }
temp-env = "0.3"
tempfile = "3"
tokio-stream = { workspace = true }
url = { workspace = true }

# DarkShell integration tests (separated from upstream tests to avoid merge conflicts)
[[test]]
name = "darkshell_blueprint_cli_integration"
path = "tests/darkshell/blueprint_cli_integration.rs"

[[test]]
name = "darkshell_exec_integration"
path = "tests/darkshell/exec_integration.rs"

[[test]]
name = "darkshell_in_sandbox_mcp_integration"
path = "tests/darkshell/in_sandbox_mcp_integration.rs"

[[test]]
name = "darkshell_mcp_cli_integration"
path = "tests/darkshell/mcp_cli_integration.rs"

[[test]]
name = "darkshell_upload_integration"
path = "tests/darkshell/upload_integration.rs"
