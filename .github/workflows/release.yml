name: Release
on:
  push:
    tags: ['ds-v[0-9]+.*']

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          shared-key: release-validate

      - name: Format check
        run: cargo +nightly fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets

      - name: Test
        run: |
          # Exclude openshell-sandbox tests that require specific UID (fails on GH runners)
          cargo test --workspace --exclude openshell-sandbox
          # Run sandbox tests separately, skipping the problematic one
          cargo test -p openshell-sandbox -- --skip drop_privileges

  build-binaries:
    name: Build (${{ matrix.target }})
    needs: validate
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            use-cross: true
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            use-cross: true
          - target: aarch64-apple-darwin
            os: macos-latest
            use-cross: false
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          shared-key: release-${{ matrix.target }}

      - name: Install cross
        if: matrix.use-cross
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: Build binary (cross)
        if: matrix.use-cross
        run: cross build --release --target ${{ matrix.target }} -p openshell-cli

      - name: Build binary (native)
        if: "!matrix.use-cross"
        run: cargo build --release --target ${{ matrix.target }} -p openshell-cli

      - name: Strip binary
        run: |
          BINARY="target/${{ matrix.target }}/release/darkshell"
          if command -v strip &> /dev/null; then
            strip "$BINARY" 2>/dev/null || true
          fi

      - name: Package artifact
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          TARGET="${{ matrix.target }}"
          ARCHIVE="darkshell-${TAG}-${TARGET}.tar.gz"
          BINARY="target/${TARGET}/release/darkshell"

          tar czf "$ARCHIVE" -C "target/${TARGET}/release" darkshell
          sha256sum "$ARCHIVE" > "${ARCHIVE}.sha256"

          echo "ARCHIVE=$ARCHIVE" >> "$GITHUB_ENV"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: darkshell-${{ matrix.target }}
          path: |
            darkshell-*.tar.gz
            darkshell-*.tar.gz.sha256
          retention-days: 1

  create-release:
    name: Create Release
    needs: build-binaries
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Install git-cliff
        uses: taiki-e/install-action@v2
        with:
          tool: git-cliff

      - name: Generate changelog
        run: |
          git cliff --latest --strip header > changelog.md 2>/dev/null || echo "Release ${GITHUB_REF#refs/tags/}" > changelog.md

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#ds-}"
          gh release create "$TAG" \
            --title "DarkShell $VERSION" \
            --notes-file changelog.md \
            artifacts/*.tar.gz artifacts/*.sha256

  sync-main:
    name: Sync Main
    needs: create-release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Fast-forward main from develop
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout main
          git merge --ff-only develop
          git push origin main
