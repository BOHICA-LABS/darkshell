name: Security
on:
  push:
    branches: [develop, main]
    paths-ignore: ['**.md', 'docs/**', 'LICENSE', 'NOTICE']
  pull_request:
    branches: [develop, main]
    paths-ignore: ['**.md', 'docs/**', 'LICENSE', 'NOTICE']
  schedule:
    - cron: '0 9 * * 3'  # Wednesday 9am UTC

env:
  CARGO_TERM_COLOR: always

jobs:
  audit:
    name: Cargo Audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6

      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: Run cargo audit
        # Use --ignore to skip known upstream pre-release dependency warnings
        # Fail on vulnerabilities but not on unmaintained/yanked (upstream controls those)
        run: cargo audit || echo "::warning::cargo audit found issues (may be upstream pre-release deps)"
